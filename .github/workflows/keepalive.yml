name: Keep LiVPN awake

on:
  schedule:
    # blitz.cloud free plan sleeps an app after ~15 minutes without
    # visitors; a ping every 10 minutes keeps the bot and scheduler alive.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          for i in 1 2 3; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 \
              https://app.livpn.prod.page/healthz || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "LiVPN did not answer with 200" >&2
          exit 1
